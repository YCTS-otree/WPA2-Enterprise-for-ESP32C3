name: Build AeroNode MicroPython Enterprise Lite

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "MicroPython PR to build: 17234 recommended, 17789 fallback"
        required: true
        default: "17234"
      idf_version:
        description: "ESP-IDF version"
        required: true
        default: "v5.4.2"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout helper package
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget curl flex bison gperf python3 python3-pip python3-venv cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0 make gcc g++ build-essential pkg-config

      - name: Clone ESP-IDF
        run: |
          IDF_VERSION="${{ github.event.inputs.idf_version }}"
          git ls-remote --exit-code --tags https://github.com/espressif/esp-idf.git "refs/tags/${IDF_VERSION}"
          git clone --branch "${IDF_VERSION}" --depth 1 --recursive https://github.com/espressif/esp-idf.git work/esp-idf
          cd work/esp-idf
          git submodule update --init --recursive --depth 1
          ./install.sh esp32c3

      - name: Clone MicroPython PR
        run: |
          git clone https://github.com/micropython/micropython.git work/micropython
          cd work/micropython
          git fetch origin "pull/${{ github.event.inputs.pr }}/head:pr-${{ github.event.inputs.pr }}"
          git checkout "pr-${{ github.event.inputs.pr }}"
          git submodule update --init lib/berkeley-db lib/micropython-lib lib/tinyusb lib/mbedtls || true

      - name: Apply AeroNode Lite trim
        run: python3 scripts/aeronode_trim.py work/micropython

      - name: Build firmware
        shell: bash
        run: |
          source work/esp-idf/export.sh
          make -C work/micropython/mpy-cross -j2
          cd work/micropython/ports/esp32
          make BOARD=ESP32_GENERIC_C3 submodules
          make BOARD=ESP32_GENERIC_C3 -j2
          mkdir -p ../../../output
          cp build-ESP32_GENERIC_C3/firmware.bin ../../../output/firmware.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32c3-enterprise
          path: |
            work/micropython/ports/esp32/build-ESP32_GENERIC_C3/firmware.bin
            work/micropython/ports/esp32/build-ESP32_GENERIC_C3/bootloader/bootloader.bin
            work/micropython/ports/esp32/build-ESP32_GENERIC_C3/partition_table/partition-table.bin
